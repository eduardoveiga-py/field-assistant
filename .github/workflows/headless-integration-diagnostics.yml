name: Headless Linux integration diagnostics
on:
  push:
    branches: ['arena/**']
    paths: ['integration_test/app_stabilization_e2e_test.dart', '.github/workflows/headless-integration-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update -qq && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter config --enable-linux-desktop && flutter pub get --enforce-lockfile
      - name: Run and report headless integration
        shell: bash
        run: |
          set +e
          xvfb-run -a flutter test --no-pub --reporter expanded integration_test/app_stabilization_e2e_test.dart -d linux > /tmp/integration-tests.txt 2>&1
          status=$?
          cat /tmp/integration-tests.txt
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_diagnostics_summary.py test /tmp/integration-tests.txt
          fi
          exit "$status"
