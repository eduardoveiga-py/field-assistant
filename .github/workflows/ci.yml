name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze_and_test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: |
          set +e
          dart analyze lib test --fatal-infos --format machine > /tmp/dart-analysis.txt
          status=$?
          cat /tmp/dart-analysis.txt
          while IFS='|' read -r severity type code file line column length message; do
            if [ -n "$message" ]; then
              echo "::error file=$file,line=$line,col=$column::$code: $message"
            fi
          done < /tmp/dart-analysis.txt
          exit "$status"

      - name: Run Automated Tests
        run: |
          set +e
          timeout 240s flutter test --coverage --reporter expanded > /tmp/flutter-tests.txt 2>&1
          status=$?
          cat /tmp/flutter-tests.txt
          if [ "$status" -eq 124 ]; then
            python3 -c 'from pathlib import Path; print("::error::Timeout nos testes. Últimas linhas: %0A" + "%0A".join(Path("/tmp/flutter-tests.txt").read_text(errors="replace").splitlines()[-20:]))'
          fi
          if [ "$status" -ne 0 ]; then
            python3 -c 'from pathlib import Path; lines=Path("/tmp/flutter-tests.txt").read_text(errors="replace").splitlines(); hits=[i for i, line in enumerate(lines) if "[E]" in line]; [print("::error::" + "%0A".join(lines[i:i+16]).replace("%", "%25").replace("%250A", "%0A")) for i in hits]'
          fi
          exit "$status"

      - name: Build Web (Release)
        run: flutter build web --release

  ios_build_check:
    name: iOS Build Verification
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --no-codesign --simulator
