name: CI / CD Pipeline

on:
  push:
    branches: [ main, master, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze_and_test:
    name: Flutter Analyze, Test & Build (Web/Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: |
          set +e
          dart analyze lib test --fatal-infos --format machine > /tmp/dart-analysis.txt
          status=$?
          cat /tmp/dart-analysis.txt
          while IFS='|' read -r severity type code file line column length message; do
            if [ -n "$message" ]; then
              echo "::error file=$file,line=$line,col=$column::$code: $message"
            fi
          done < /tmp/dart-analysis.txt
          exit "$status"

      - name: Run Automated Tests
        run: |
          set +e
          flutter test --coverage --reporter expanded > /tmp/flutter-tests.txt 2>&1
          status=$?
          cat /tmp/flutter-tests.txt
          if [ "$status" -ne 0 ]; then
            python3 -c 'from pathlib import Path; lines=Path("/tmp/flutter-tests.txt").read_text(errors="replace").splitlines(); hits=[i for i,line in enumerate(lines) if ("[E]" in line or "EXCEPTION" in line or "Expected:" in line or "Actual:" in line or "Some tests failed" in line or "timed out" in line.lower())]; [print("::error::" + "%0A".join(lines[max(0,i-6):i+14]).replace("%", "%25")) for i in hits[:6]]'
          fi
          exit "$status"

      - name: Build Web (Release)
        run: flutter build web --release

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Build Android AppBundle (Release)
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  ios_build_check:
    name: iOS Build Verification
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --no-codesign --simulator

  publish_release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [ analyze_and_test, ios_build_check ]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-release
          path: web-dist

      - name: Package Web Release (Zip)
        run: |
          cd web-dist && zip -r ../web-release.zip . && cd ..

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web-release.zip
            android-dist/app-release.apk
            android-dist/app-release.aab
          generate_release_notes: true
