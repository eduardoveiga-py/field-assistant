name: CI / CD Pipeline

on:
  push:
    branches: [ main, master, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version_consistency:
    name: Check Version Consistency (pubspec / AppVersion / apps.json / Tag)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Version Metadata Matches Across Files
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          pubspec = Path("pubspec.yaml").read_text(encoding="utf-8")
          m_pub = re.search(r"^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)", pubspec, re.M)
          assert m_pub, "pubspec.yaml version not found"
          pub_ver, pub_build = m_pub.group(1), int(m_pub.group(2))

          app_ver_src = Path("lib/core/app_version.dart").read_text(encoding="utf-8")
          m_ver = re.search(r"static const String version\s*=\s*'([^']+)'", app_ver_src)
          m_bld = re.search(r"static const int buildNumber\s*=\s*(\d+)", app_ver_src)
          assert m_ver and m_bld, "AppVersion constants not found"
          assert m_ver.group(1) == pub_ver, f"AppVersion.version ({m_ver.group(1)}) != pubspec ({pub_ver})"
          assert int(m_bld.group(1)) == pub_build, f"AppVersion.buildNumber ({m_bld.group(1)}) != pubspec ({pub_build})"

          apps_root = json.loads(Path("apps.json").read_text(encoding="utf-8"))
          apps = apps_root["apps"][0]
          assert apps["version"] == pub_ver, f"apps.json version ({apps['version']}) != pubspec ({pub_ver})"
          for label, url_val in [
              ("root iconURL", apps_root.get("iconURL", "")),
              ("root headerURL", apps_root.get("headerURL", "")),
              ("app iconURL", apps.get("iconURL", "")),
              ("sourceURL", apps_root.get("sourceURL", "")),
          ]:
              assert "@master" not in url_val and "@main" not in url_val, (
                  f"apps.json {label} points to mutable branch: {url_val}"
              )

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              tag_ver = ref[len("refs/tags/v"):]
              assert tag_ver == pub_ver, f"Git tag v{tag_ver} != pubspec {pub_ver}"
          print(f"Version consistency OK: {pub_ver}+{pub_build}")
          PY

  verify_release_configuration:
    name: Verify release configuration
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Require build configuration and Android signing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Release configuration missing: $name"; exit 1; fi
          done

  build_sai_release_map:
    name: Build experimental SAI release map
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install local vector rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qgis python3-qgis gdal-bin osmium-tool fonts-dejavu-core
      - name: Render and verify full extent
        run: |
          bash tool/map/build_sai.sh "$RUNNER_TEMP/sai"
          python3 tool/map/verify_full_extent.py "$RUNNER_TEMP/sai/output/sai-experimental.mbtiles"
          mv "$RUNNER_TEMP/sai/output/sai-experimental.mbtiles" "$RUNNER_TEMP/sai/output/br_am_solimoes.mbtiles"
          (cd "$RUNNER_TEMP/sai/output" && sha256sum br_am_solimoes.mbtiles > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: sai-release-map
          path: ${{ runner.temp }}/sai/output/
          if-no-files-found: error

  test_and_lint:
    name: Flutter Analyze & Test
    needs: [ version_consistency ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Outdated Dependencies (Informative M11)
        run: flutter pub outdated --no-dev-dependencies || true

      - name: Run Static Analysis
        run: |
          set +e
          dart analyze lib test --fatal-warnings --format machine > /tmp/dart-analysis.txt
          status=$?
          cat /tmp/dart-analysis.txt
          while IFS='|' read -r severity type code file line column length message; do
            if [ -n "$message" ] && [ "$severity" = "ERROR" ]; then
              echo "::error file=$file,line=$line,col=$column::$code: $message"
            elif [ -n "$message" ] && [ "$severity" = "WARNING" ]; then
              echo "::warning file=$file,line=$line,col=$column::$code: $message"
            fi
          done < /tmp/dart-analysis.txt
          exit "$status"

      - name: Run Automated Tests
        run: |
          set +e
          flutter test --coverage --reporter expanded > /tmp/flutter-tests.txt 2>&1
          status=$?
          cat /tmp/flutter-tests.txt
          if [ "$status" -ne 0 ]; then
            python3 -c 'from pathlib import Path; lines=Path("/tmp/flutter-tests.txt").read_text(errors="replace").splitlines(); hits=[i for i,line in enumerate(lines) if ("[E]" in line or "EXCEPTION" in line or "Expected:" in line or "Actual:" in line or "Some tests failed" in line or "timed out" in line.lower())]; [print("::error::" + "%0A".join(lines[max(0,i-6):i+14]).replace("%", "%25")) for i in hits[:6]]'
          fi
          exit "$status"

  build_android_and_web:
    name: Build Web & Android APK
    runs-on: ubuntu-latest
    needs: [ test_and_lint ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Inject Optional Web Client ID & Build Defines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          AUTH_NATIVE_CALLBACK: ${{ vars.AUTH_NATIVE_CALLBACK }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          web_client = os.environ.get("GOOGLE_WEB_CLIENT_ID", "").strip()
          if web_client:
              idx = Path("web/index.html")
              text = idx.read_text(encoding="utf-8")
              full_id = web_client if web_client.endswith(".apps.googleusercontent.com") else f"{web_client}.apps.googleusercontent.com"
              idx.write_text(
                  text.replace("YOUR_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com", full_id),
                  encoding="utf-8",
              )

          defines = []
          for key in ("SUPABASE_URL", "SUPABASE_ANON_KEY", "GOOGLE_WEB_CLIENT_ID"):
              val = os.environ.get(key, "").strip()
              if val:
                  defines.append(f"--dart-define={key}={val}")
          if os.environ.get("AUTH_NATIVE_CALLBACK", "").strip().lower() == "true":
              defines.append("--dart-define=AUTH_NATIVE_CALLBACK=true")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"DART_DEFINES={' '.join(defines)}\n")
          PY

      - name: Build Web (Release)
        run: flutter build web --release $DART_DEFINES

      - name: Decode Android Release Keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            echo "ANDROID_KEYSTORE_PATH=release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK (Release arm64-v8a)
        env:
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$IS_RELEASE_TAG" = "true" ]; then export ORG_GRADLE_PROJECT_requireReleaseSigning=true; fi
          set -o pipefail
          flutter build apk --target-platform android-arm64 --release $DART_DEFINES 2>&1 | tee /tmp/android-build.log || {
            python3 - <<'PY2'
          from pathlib import Path
          text = '\n'.join(Path('/tmp/android-build.log').read_text(errors='replace').splitlines()[-35:])[-5000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Android build failure::{text}')
          PY2
            exit 1
          }

      - name: Stage Web & Android Release Artifacts
        run: |
          mkdir -p dist
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/app-arm64-v8a-release.apk
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/app-release.apk
          else
            cp build/app/outputs/flutter-apk/app-release.apk dist/app-arm64-v8a-release.apk
            cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
          fi
          cd build/web && zip -r ../../dist/web-release.zip . && cd ../..

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-release
          path: dist/app-arm64-v8a-release.apk

      - name: Upload Release Dist
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  ios_build_check:
    name: iOS Build Verification & IPA Packaging
    runs-on: macos-latest
    needs: [ test_and_lint ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Inject Optional iOS Client ID & Build Defines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          AUTH_NATIVE_CALLBACK: ${{ vars.AUTH_NATIVE_CALLBACK }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          ios_client = os.environ.get("GOOGLE_IOS_CLIENT_ID", "").strip()
          if ios_client:
              plist = Path("ios/Runner/Info.plist")
              text = plist.read_text(encoding="utf-8")
              prefix = ios_client.removesuffix(".apps.googleusercontent.com")
              full_id = f"{prefix}.apps.googleusercontent.com"
              text = text.replace("YOUR_GOOGLE_IOS_CLIENT_ID.apps.googleusercontent.com", full_id)
              text = text.replace("com.googleusercontent.apps.YOUR_GOOGLE_IOS_CLIENT_ID", f"com.googleusercontent.apps.{prefix}")
              plist.write_text(text, encoding="utf-8")

          defines = []
          for key in ("SUPABASE_URL", "SUPABASE_ANON_KEY", "GOOGLE_WEB_CLIENT_ID"):
              val = os.environ.get(key, "").strip()
              if val:
                  defines.append(f"--dart-define={key}={val}")
          if os.environ.get("AUTH_NATIVE_CALLBACK", "").strip().lower() == "true":
              defines.append("--dart-define=AUTH_NATIVE_CALLBACK=true")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"DART_DEFINES={' '.join(defines)}\n")
          PY

      - name: Build iOS (No Codesign)
        run: flutter build ios --no-codesign --release $DART_DEFINES

      - name: Package Unsigned iOS IPA
        run: |
          mkdir -p dist-ios/Payload
          cp -r build/ios/iphoneos/Runner.app dist-ios/Payload/
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png dist-ios/Payload/Runner.app/
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png dist-ios/Payload/Runner.app/AppIcon.png
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-60x60@2x.png dist-ios/Payload/Runner.app/AppIcon60x60.png
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-60x60@2x.png dist-ios/Payload/Runner.app/AppIcon60x60@2x.png
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-76x76@2x.png dist-ios/Payload/Runner.app/AppIcon76x76.png
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-76x76@2x.png dist-ios/Payload/Runner.app/AppIcon76x76.png
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-76x76@2x.png dist-ios/Payload/Runner.app/AppIcon76x76@2x~ipad.png
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png dist-ios/Payload/Runner.app/Icon-App-1024x1024@1x.png
          cd dist-ios && zip -r app-release-unsigned.ipa Payload && rm -rf Payload && cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist-ios/app-release-unsigned.ipa

  build_windows:
    name: Build Windows 10/11 x64
    runs-on: windows-latest
    needs: [ test_and_lint ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          $ErrorActionPreference = 'Continue'
          $defines = @()
          foreach ($k in @('SUPABASE_URL', 'SUPABASE_ANON_KEY', 'GOOGLE_WEB_CLIENT_ID')) {
            $v = [Environment]::GetEnvironmentVariable($k)
            if (-not [string]::IsNullOrWhiteSpace($v)) {
              $defines += "--dart-define=$k=$($v.Trim())"
            }
          }
          flutter build windows --release @defines 2>&1 | Tee-Object -FilePath build-windows.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $errors = Get-Content build-windows.log | Select-String -Pattern "error |CMake Error|fatal error|FAILED" | Select-Object -First 25
            foreach ($e in $errors) {
              Write-Host "::error::$($e.Line)"
            }
            $tail = (Get-Content build-windows.log -Tail 25) -join "%0A"
            Write-Host "::error::$tail"
            exit $exitCode
          }

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist-windows\field-assistant-windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist-windows/field-assistant-windows-x64.zip

  build_linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    needs: [ test_and_lint ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsqlite3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: |
          flutter config --enable-linux-desktop
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux (Release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          DART_DEFINES=""
          for k in SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_WEB_CLIENT_ID; do
            v="$(eval echo "\$$k")"
            if [ -n "$v" ]; then
              DART_DEFINES="$DART_DEFINES --dart-define=$k=$v"
            fi
          done
          flutter build linux --release $DART_DEFINES

      - name: Package Linux Artifact
        run: |
          mkdir -p dist-linux
          tar -czvf dist-linux/field-assistant-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist-linux/field-assistant-linux-x64.tar.gz

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [ test_and_lint ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Enable macOS Desktop
        run: |
          flutter config --enable-macos-desktop
          if [ ! -d "macos" ]; then
            flutter create --platforms=macos .
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS (Release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          DART_DEFINES=""
          for k in SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_WEB_CLIENT_ID; do
            v="$(eval echo "\$$k")"
            if [ -n "$v" ]; then
              DART_DEFINES="$DART_DEFINES --dart-define=$k=$v"
            fi
          done
          flutter build macos --release $DART_DEFINES

      - name: Package macOS Artifact
        run: |
          mkdir -p dist-macos
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../dist-macos/field-assistant-macos.zip *.app
          cd ../../../../..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist-macos/field-assistant-macos.zip

  publish_release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [ build_android_and_web, ios_build_check, build_windows, build_linux, build_macos, verify_release_configuration, build_sai_release_map ]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Release Dist Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: release-dist

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: ios-dist

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: windows-dist

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: linux-dist

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: macos-dist

      - name: Download experimental SAI map and provenance
        uses: actions/download-artifact@v4
        with:
          name: sai-release-map
          path: sai-dist

      - name: Stage release manifest and map provenance
        run: |
          python3 - <<'PY2'
          import json
          from pathlib import Path
          source = json.loads(Path('apps.json').read_text(encoding='utf-8'))
          app = source['apps'][0]
          actual_size = Path('ios-dist/app-release-unsigned.ipa').stat().st_size
          if actual_size <= 0:
              raise SystemExit('Empty IPA')
          app['size'] = actual_size
          app['versions'][0]['size'] = actual_size
          Path('release-dist/apps.json').write_text(json.dumps(source, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY2
          cd sai-dist && zip -q mapa-sai-proveniencia.zip LEIA-ME.txt source-sha256.txt source-info.txt SHA256SUMS.txt

      - name: Generate SHA-256 Checksums
        run: |
          mkdir -p checksums
          sha256sum \
            release-dist/app-arm64-v8a-release.apk \
            release-dist/app-release.apk \
            ios-dist/app-release-unsigned.ipa \
            release-dist/web-release.zip \
            windows-dist/field-assistant-windows-x64.zip \
            linux-dist/field-assistant-linux-x64.tar.gz \
            macos-dist/field-assistant-macos.zip \
            sai-dist/br_am_solimoes.mbtiles \
            sai-dist/mapa-sai-proveniencia.zip > checksums/SHA256SUMS.txt
          sed -i 's|release-dist/||g; s|ios-dist/||g; s|windows-dist/||g; s|linux-dist/||g; s|macos-dist/||g; s|sai-dist/||g' checksums/SHA256SUMS.txt
          cat checksums/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/app-arm64-v8a-release.apk
            release-dist/app-release.apk
            ios-dist/app-release-unsigned.ipa
            release-dist/web-release.zip
            windows-dist/field-assistant-windows-x64.zip
            linux-dist/field-assistant-linux-x64.tar.gz
            macos-dist/field-assistant-macos.zip
            release-dist/apps.json
            sai-dist/br_am_solimoes.mbtiles
            sai-dist/mapa-sai-proveniencia.zip
            checksums/SHA256SUMS.txt
          generate_release_notes: true

      - name: Invalidate jsDelivr CDN Cache for apps.json
        run: |
          curl -fsSL -X GET "https://purge.jsdelivr.net/gh/${{ github.repository }}@master/apps.json" || true


