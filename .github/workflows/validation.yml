name: Independent Flutter validation
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    name: Dart diagnostics (independent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze and summarize diagnostics
        shell: bash
        run: |
          set +e
          dart analyze lib test --fatal-infos --format machine > /tmp/analysis.txt 2>&1
          status=$?
          cat /tmp/analysis.txt
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_diagnostics_summary.py analyze /tmp/analysis.txt
          fi
          exit "$status"
  tests:
    name: Flutter tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [maps, all]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test and summarize failures
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set +e
          if [ "$SUITE" = maps ]; then
            flutter test --concurrency=1 --reporter expanded test/territory/location_picker_safety_test.dart test/territory/map_safety_regression_test.dart test/territory/mbtiles_service_real_test.dart test/tile_cache_test.dart test/layout_fixes_and_map_highlight_test.dart > /tmp/tests.txt 2>&1
          else
            flutter test --reporter expanded > /tmp/tests.txt 2>&1
          fi
          status=$?
          cat /tmp/tests.txt
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_diagnostics_summary.py test /tmp/tests.txt
          fi
          exit "$status"
  build_windows_check:
    name: Windows compilation check (no credentials)
    needs: [tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Compile Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-check.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) { python tool/ci_diagnostics_summary.py test build-check.txt }
          exit $code
  build_ios_check:
    name: iOS compilation check (unsigned, no credentials)
    needs: [tests]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile iOS without signing
        shell: bash
        run: |
          set +e
          flutter build ios --no-codesign --release > /tmp/ios-build.txt 2>&1
          status=$?
          cat /tmp/ios-build.txt
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_diagnostics_summary.py test /tmp/ios-build.txt
          fi
          exit "$status"
