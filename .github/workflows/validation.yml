name: Independent Flutter validation
on:
  push:
    branches: ['main', 'master', 'stabilization/**', 'arena/**']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vector_generator_safety:
    name: Vector generator fail-closed safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash test/tool/vector_generator_safety_test.sh
  sql_safety:
    name: SQL isolation and compare-and-swap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.16
      - run: node test/sql/sync_compare_and_swap_test.mjs
      - run: node test/sql/experimental_encrypted_records_test.mjs
      - run: node test/sql/experimental_recovery_vault_test.mjs
      - run: node test/sql/production_e2ee_test.mjs
  diagnostics:
    name: Dart diagnostics (independent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Resolve locked dependencies
        shell: bash
        run: |
          flutter --version
          set +e
          flutter pub get --enforce-lockfile > /tmp/locked-pub.txt 2>&1
          status=$?
          cat /tmp/locked-pub.txt
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          for line in Path('/tmp/locked-pub.txt').read_text(errors='replace').splitlines()[-25:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
          exit "$status"
      - name: Analyze and summarize diagnostics
        shell: bash
        run: |
          set +e
          dart analyze lib test --fatal-warnings --format machine > /tmp/analysis.txt 2>&1
          status=$?
          cat /tmp/analysis.txt
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_diagnostics_summary.py analyze /tmp/analysis.txt
          fi
          exit "$status"
  locked_sdk_probe:
    name: Flutter 3.47.8 lockfile compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Test SDK and locked dependencies
        shell: bash
        run: |
          flutter --version
          set +e
          flutter pub get --enforce-lockfile > /tmp/probe.txt 2>&1
          status=$?
          cat /tmp/probe.txt
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          for line in Path('/tmp/probe.txt').read_text(errors='replace').splitlines()[-25:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
          exit "$status"
  containment_diagnostics:
    name: Containment diagnostics (locked dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      # Additional focused diagnostics use the same strict lockfile.
      - run: flutter pub get --enforce-lockfile
      - name: Analyze containment changes
        shell: bash
        run: |
          set +e
          dart analyze lib test integration_test --fatal-warnings --format machine > /tmp/containment-analyze.txt 2>&1
          status=$?
          cat /tmp/containment-analyze.txt
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          for line in Path('/tmp/containment-analyze.txt').read_text().splitlines():
              if line.startswith(('ERROR|', 'WARNING|')):
                  print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
          exit "$status"
      - name: Verify sync remains paused even if build flag is enabled
        run: flutter test --no-pub --dart-define=ENABLE_E2EE_SYNC=true test/sync/privacy_pause_test.dart
      - name: Test containment changes
        shell: bash
        run: |
          set +e
          flutter test --concurrency=1 --reporter expanded test/sync/crypto/e2ee_service_test.dart test/sync/crypto/recovery_key_store_test.dart test/sync/crypto/supabase_crypto_transport_and_service_test.dart test/sync/account_isolation_test.dart test/territory/map_engine/offline_map_package_manager_test.dart test/territory/map_engine/package_download_recovery_test.dart test/ui/widgets/e2ee_setup_dialog_test.dart test/ui/map_rotation_and_e2ee_settings_test.dart > /tmp/containment-tests.txt 2>&1
          status=$?
          cat /tmp/containment-tests.txt
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('/tmp/containment-tests.txt').read_text().splitlines()
          for line in lines[-80:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
          exit "$status"
  smtp_widget_regression:
    name: SMTP widget loopback repeatability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Repeat SMTP widget flow five times
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if ! flutter test --no-pub --reporter expanded test/audit_round2_features_test.dart --plain-name 'InboxScreen compose sheet validates missing credentials and sends via SMTP when configured' > /tmp/smtp-test.log 2>&1; then
              cat /tmp/smtp-test.log
              python3 tool/ci_diagnostics_summary.py test /tmp/smtp-test.log
              exit 1
            fi
          done
  immutable_media_unit:
    name: Immutable media unit regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Test immutable media failures
        shell: bash
        run: |
          set +e
          flutter test --no-pub --reporter expanded test/sync/crypto/immutable_encrypted_media_test.dart > /tmp/immutable-test.txt 2>&1
          status=$?
          cat /tmp/immutable-test.txt
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_diagnostics_summary.py test /tmp/immutable-test.txt
          fi
          exit "$status"
  web_map_regression:
    name: Browser map switch regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run map regression in Chrome
        shell: bash
        run: |
          set +e
          flutter test --no-pub --platform chrome --reporter expanded test/territory/map_engine/web_map_switch_regression_test.dart > /tmp/map-web-test.txt 2>&1
          status=$?
          cat /tmp/map-web-test.txt
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_diagnostics_summary.py test /tmp/map-web-test.txt
          fi
          exit "$status"
  tests:
    name: Flutter tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [maps, all]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Test and summarize failures
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set +e
          if [ "$SUITE" = maps ]; then
            flutter test --concurrency=1 --reporter expanded test/territory/map_navigation_regression_test.dart test/territory/offline_parent_cache_test.dart test/territory/tile_cache_race_test.dart test/territory/location_picker_safety_test.dart test/territory/map_safety_regression_test.dart test/territory/mbtiles_service_real_test.dart test/tile_cache_test.dart test/layout_fixes_and_map_highlight_test.dart > /tmp/tests.txt 2>&1
          else
            # Bound the full suite and preserve its last output if it hangs.
            timeout --kill-after=30s 20m flutter test --reporter expanded > /tmp/tests.txt 2>&1
          fi
          status=$?
          cat /tmp/tests.txt
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_diagnostics_summary.py test /tmp/tests.txt
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('/tmp/tests.txt').read_text(errors='replace').splitlines()[-30:]
          print('::error::Flutter test timed out; tail: ' + '%0A'.join(lines).replace('%', '%25'))
          PYCODE
            fi
          fi
          exit "$status"
  build_windows_check:
    name: Windows compilation check (no credentials)
    needs: [tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - name: Compile Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-check.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) { python tool/ci_diagnostics_summary.py test build-check.txt }
          exit $code
  build_ios_check:
    name: iOS compilation check (unsigned, no credentials)
    needs: [tests]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile iOS without signing
        shell: bash
        run: |
          set +e
          flutter build ios --no-codesign --release > /tmp/ios-build.txt 2>&1
          status=$?
          cat /tmp/ios-build.txt
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_diagnostics_summary.py test /tmp/ios-build.txt
          fi
          exit "$status"
