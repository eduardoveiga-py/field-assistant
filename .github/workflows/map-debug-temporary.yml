name: Temporary map diagnostics
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/map-debug-temporary.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test focused and expose output
        shell: bash
        run: |
          set +e
          timeout 90s flutter test --concurrency=1 --reporter expanded test/territory/map_navigation_regression_test.dart > /tmp/focused.txt 2>&1
          status=$?
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/focused.txt').read_text(errors='replace')
          print(text)
          text=text[-14000:].replace('%','%25').replace('\n','%0A').replace('\r','%0D')
          print(f'::error title=Focused map test output::{text}')
          PY
          exit "$status"

