name: Android compilation check
on:
  push:
    branches: ['arena/**']
    paths: ['android/**', '.github/workflows/android-check.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile test APK with debug signing
        run: |
          set -o pipefail
          flutter build apk --target-platform android-arm64 --release 2>&1 | tee /tmp/android-check.log || {
            python3 - <<'PY'
          from pathlib import Path
          text = '\n'.join(Path('/tmp/android-check.log').read_text(errors='replace').splitlines()[-35:])[-5000:]
          print('::error title=Android compilation::' + text.replace('%', '%25').replace('\n','%0A'))
          PY
            exit 1
          }
