name: Experimental regional vector extraction
on:
  push:
    branches: ['arena/**']
    paths: ['tool/map/extract_regional_pmtiles.py', 'tool/map/requirements-extraction.txt', 'test/tool/test_regional_pmtiles.py', 'test/territory/map_engine/real_pmtiles_integration_test.dart', 'lib/territory/packages/offline_map_package_manager.dart', '.github/workflows/vector-regional-experimental.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    name: Extract and inspect real vector tiles (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate extractor safeguards
        run: python3 -m unittest discover -s test/tool -p test_regional_pmtiles.py
      - name: Install pinned decoder dependencies
        run: python3 -m pip install --break-system-packages -r tool/map/requirements-extraction.txt
      - name: Download and verify official PMTiles CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz -o "$RUNNER_TEMP/pmtiles.tar.gz"
          echo '3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  '"$RUNNER_TEMP/pmtiles.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/pmtiles-cli"
          tar -xzf "$RUNNER_TEMP/pmtiles.tar.gz" -C "$RUNNER_TEMP/pmtiles-cli"
          echo "$RUNNER_TEMP/pmtiles-cli" >> "$GITHUB_PATH"
      - name: Extract and inspect Alto Solimões sample
        shell: bash
        run: |
          set +e
          python3 tool/map/extract_regional_pmtiles.py \
            --source https://build.protomaps.com/20260811.pmtiles \
            --source-description 'Protomaps Basemap daily build 2026-08-11 (OSM and Natural Earth)' \
            --license ODbL-1.0 \
            --attribution 'Protomaps © OpenStreetMap contributors; Natural Earth' \
            --bbox=-68.2,-3.4,-67.7,-3.0 --minzoom 0 --maxzoom 14 \
            --sample=-67.9397,-3.1022 --output "$RUNNER_TEMP/regional-vector" > /tmp/vector-extract.log 2>&1
          status=$?
          cat /tmp/vector-extract.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          text = '\n'.join(Path('/tmp/vector-extract.log').read_text(errors='replace').splitlines()[-30:])
          print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
          exit "$status"
      - name: Record provenance and verify reader against real bytes
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          p = Path('${{ runner.temp }}/regional-vector/provenance.json')
          d = json.loads(p.read_text())
          print('::notice::PMTILES_PROVENANCE:' + json.dumps({k:d[k] for k in ('source','sizeBytes','sha256','header','samples','pmtilesVersion')}, separators=(',', ':')))
          PYCODE
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compare app reader with CLI-extracted tile
        run: |
          pmtiles tile "$RUNNER_TEMP/regional-vector/regional.pmtiles" 14 5099 8333 > "$RUNNER_TEMP/expected-real-tile.bin"
          REAL_PMTILES="$RUNNER_TEMP/regional-vector/regional.pmtiles" EXPECTED_TILE="$RUNNER_TEMP/expected-real-tile.bin" flutter test --no-pub test/territory/map_engine/real_pmtiles_integration_test.dart
      - name: Save experimental artifact and provenance (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regional-vector-experimental
          path: ${{ runner.temp }}/regional-vector/
          if-no-files-found: error
          retention-days: 14
