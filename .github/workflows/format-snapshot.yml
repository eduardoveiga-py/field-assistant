name: Dart format patch diagnostics
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/format-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format_patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Compute format-only patch without changing repository
        shell: bash
        run: |
          dart format lib test integration_test
          git diff --binary -- lib test integration_test | gzip -9 | base64 -w0 > /tmp/format.patch.gz.b64
          python3 - <<'PYCODE'
          from pathlib import Path
          data = Path('/tmp/format.patch.gz.b64').read_text()
          chunks = [data[i:i+3900] for i in range(0, len(data), 3900)]
          if len(chunks) > 10:
              raise SystemExit('Patch too large to emit safely')
          for i, chunk in enumerate(chunks):
              print(f'::notice::FORMAT_PATCH_{i:02}_{len(chunks):02}:{chunk}')
          PYCODE
